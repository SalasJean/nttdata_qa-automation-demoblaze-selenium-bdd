[pytest]
bdd_features_base_dir = tests/features/
testpaths = tests
python_files = test_*.py
addopts = --alluredir=reports/allure-results --clean-alluredir -v
markers =
    HappyPath: Escenarios de flujo principal exitoso
    NegativePath: Escenarios de validacion negativa y bordes
    smoke: Pruebas rapidas de humo sobre funcionalidades criticas
    regression: Suite completa de regresion funcional
